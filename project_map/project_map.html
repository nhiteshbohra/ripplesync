<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Map</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --edge: #9aa5b3; --obj: #8854d0;
  --border: #dde2e8; --hl: #111827; --chip: #eef1f5; --warn: #b45309; --stage: #e8590c; --stagebg: #fff4ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa4b2; --edge: #5b6574; --obj: #b48cf2;
    --border: #2c323d; --hl: #ffffff; --chip: #262c36; --warn: #f59e0b; --stage: #ff9f43; --stagebg: #2a2118;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa4b2; --edge: #5b6574; --obj: #b48cf2;
  --border: #2c323d; --hl: #ffffff; --chip: #262c36; --warn: #f59e0b; --stage: #ff9f43; --stagebg: #2a2118;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 4px 0 0; white-space: nowrap; }
header .stats { color: var(--muted); font-size: 12px; }
#stagebar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 13px; }
#stagebar label { color: var(--muted); }
#stagebar select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; max-width: 260px; }
#stageTitle { font-weight: 600; color: var(--stage); }
#searchWrap { position: relative; flex: 1 1 200px; max-width: 400px; }
#search { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; }
#results { position: absolute; top: 34px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; max-height: 320px; overflow: auto; z-index: 30; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#results div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
#results div:hover, #results div.active { background: var(--chip); }
#results small { color: var(--muted); display: block; }
button { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
button.on { background: var(--stage); color: #fff; border-color: var(--stage); }
main { position: relative; flex: 1; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.panning { cursor: grabbing; }
.edge { stroke: var(--edge); stroke-width: 1.1; fill: none; opacity: .55; pointer-events: none; }
.edge.lazy { stroke-dasharray: 4 3; }
.edge.obj { stroke: var(--obj); stroke-dasharray: 7 3 1 3; opacity: .7; }
.edge.dup { stroke-dasharray: 1 3; stroke-width: 1.4; opacity: .7; }
.edge.hl { opacity: 1; stroke-width: 2.2; }
.edge.out.hl { stroke: #2e86de; }
.edge.in.hl { stroke: #e4572e; }
.edge.stage { stroke: var(--stage); opacity: 1; stroke-width: 2.6; stroke-dasharray: none; }
.edge.focus { stroke-width: 4.5; }
.hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; pointer-events: stroke; }
.hit:hover + .edge { opacity: 1; stroke-width: 2.6; }
.node circle { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; }
.node text { fill: var(--text); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.node text.name { font-size: var(--fs, 12px); font-weight: 600; }
.node text.job { font-size: var(--fsj, 10px); fill: var(--muted); }
.node.core-file circle { stroke: var(--hl); stroke-width: 3; }
.node.sel circle { stroke: var(--hl); stroke-width: 3.5; }
.node.match circle { stroke: #f43f5e; stroke-width: 3.5; }
.node.instage circle { stroke: var(--stage); stroke-width: 4; }
.faded, .edge.faded, .node.faded { opacity: .08; }
.colhead { font-weight: 700; fill: var(--muted); font-size: var(--fs, 12px); }
.colhead.cur { fill: var(--stage); font-size: calc(var(--fs, 12px) * 1.25); }
.colline { stroke: var(--border); stroke-dasharray: 3 5; }
.colnote { fill: var(--muted); font-size: var(--fsj, 10px); font-style: italic; }
#legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 300px; z-index: 5; }
#legend .row { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 2px 0; user-select: none; }
#legend .row.off { opacity: .35; }
#legend .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
#legend .hint { color: var(--muted); margin-top: 6px; line-height: 1.5; }
#legend .hint svg { vertical-align: middle; }
#legendToggle { position: absolute; left: 12px; bottom: 12px; z-index: 6; display: none; }
#zoomBox { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
#zoomBox button { width: 34px; height: 30px; padding: 0; font-size: 16px; }
#panel { position: absolute; top: 0; right: 0; width: min(470px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--border); overflow: auto; padding: 14px 16px 40px; transform: translateX(100%); transition: transform .18s ease; z-index: 20; }
#panel.open { transform: none; }
#panel h2 { font-size: 17px; margin: 0 28px 2px 0; word-break: break-word; }
#panel .path { color: var(--muted); font-size: 12px; word-break: break-all; }
#panel h3 { font-size: 12px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#panel p { margin: 4px 0; }
#panel ul { margin: 4px 0; padding-left: 18px; }
#panel li { margin: 2px 0; }
#panel .job { font-size: 15px; font-weight: 600; margin: 8px 0 2px; }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12px; cursor: pointer; border: 1px solid var(--border); color: var(--text); }
.chip.plain { cursor: default; }
.chip.stagechip { border-color: var(--stage); }
#panel .badge { display: inline-block; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 6px 6px 0 0; }
#panel .close { position: absolute; top: 10px; right: 12px; font-size: 18px; padding: 0 8px; }
#panel .fn, #panel .call { border-top: 1px solid var(--border); padding: 6px 0; }
#panel .fn code, #panel .call code { font-weight: 600; }
#panel .meta { color: var(--muted); font-size: 12px; }
#panel .unused { color: var(--warn); font-weight: 600; font-size: 12px; }
#panel .note { color: var(--warn); }
#panel .conn { display: block; padding: 3px 6px; margin: 2px 0; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); font-size: 12.5px; }
#panel .conn:hover { background: var(--chip); }
#panel .kv { display: grid; grid-template-columns: 82px 1fr; gap: 1px 8px; font-size: 12.5px; margin-top: 3px; }
#panel .kv b { color: var(--muted); font-weight: 600; }
#fnFilter { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); margin: 4px 0; }
#stagecard { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; width: min(760px, calc(100% - 24px)); max-height: 36%; overflow: auto; background: var(--stagebg); border: 2px solid var(--stage); border-radius: 10px; padding: 10px 14px; z-index: 10; display: none; box-shadow: 0 6px 22px rgba(0,0,0,.2); }
#stagecard h4 { margin: 0 0 4px; font-size: 15px; color: var(--stage); }
#stagecard p { margin: 2px 0 6px; }
#stagecard ol { margin: 0; padding-left: 22px; font-size: 12.5px; }
#stagecard li { padding: 2px 4px; border-radius: 5px; cursor: default; }
#stagecard li:hover { background: var(--chip); }
#stagecard .d { color: var(--muted); }
#stagecard .x { float: right; padding: 0 7px; }
#hover { position: fixed; pointer-events: none; z-index: 40; max-width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.2); display: none; }
#hover b { display: block; }
#hover .m { color: var(--muted); }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
@media (max-width: 700px) {
  header h1 { font-size: 14px; } header .stats { display: none; }
  #legend { display: none; } #legend.show { display: block; max-width: calc(100% - 70px); }
  #legendToggle { display: block; }
  #stagecard { top: auto; bottom: 8px; max-height: 42%; }
}
</style>
</head>
<body>
<header>
  <h1>Project map</h1>
  <span class="stats" id="stats"></span>
  <div id="searchWrap"><input id="search" type="search" placeholder="Search files, functions, words… (Enter = open)" autocomplete="off" aria-label="Search"><div id="results"></div></div>
  <button id="btnTests" title="Show or hide test files">Tests: on</button>
  <button id="btnLegacy" title="Show or hide legacy scripts">Legacy: on</button>
  <button id="btnLayout" title="Put every file back in its starting place">Reset layout</button>
  <button id="btnTheme" title="Light / dark">Theme</button>
</header>
<div id="stagebar">
  <label for="flowSel">Stages of:</label>
  <select id="flowSel"><option value="">— pick a command —</option></select>
  <button id="stPrev" title="Previous stage (←)" disabled>◀</button>
  <span id="stageTitle">Pick a command to see, stage by stage, which files work together</span>
  <button id="stNext" title="Next stage (→)" disabled>▶</button>
  <button id="stPlay" title="Play all stages" disabled>Play</button>
  <button id="stAll" title="Show every stage of this command at once" disabled>All stages</button>
  <button id="stArrange" title="Place files in columns, one column per stage" disabled>Arrange by stage</button>
</div>
<main>
  <svg id="graph" aria-label="File dependency graph">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path></marker>
    </defs>
    <g id="viewport"><g id="cols"></g><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <div id="stagecard" aria-live="polite"></div>
  <div id="legend"></div>
  <button id="legendToggle">Legend</button>
  <div id="zoomBox"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit everything on screen">⤢</button></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<div id="hover"></div>

ing answers, reconnects when the connection drops, tries the next server in the list, and refuses a node that reports a different network (for example testnet).", "how": "WsSource keeps one websocket (_Conn) and many requests in flight at once; each request has an id and a Future, and _read_loop hands each answer to the request with the same id. _open() tries every server several times with growing waits (RetryPolicy from fetcher.py) and checks network_id. A request that times out only drops the connection if nothing at all arrived during the timeout (hung socket). Error answers become RpcError; node 'warnings' are kept with the result.", "lines": 264, "folder": "xrpl_ingest", "functions": [{"n": "_default_connect", "k": "function", "d": "Opens a real websocket with the websockets library (imported only here, so tests can use a fake).", "i": "url: str, *, timeout: float, max_size: int", "o": "websocket connection", "u": false}, {"n": "_Conn", "k": "class", "d": "One open websocket plus the requests waiting for an answer on it.", "i": "-", "o": "-", "u": false}, {"n": "_Conn.__init__", "k": "method", "d": "Stores the socket and the server URL (password removed), starts counters.", "i": "ws: Any, url: str", "o": "nothing (constructor)", "u": false}, {"n": "_Conn.fail_pending", "k": "method", "d": "Fails every waiting request with the given error.", "i": "exc: Exception", "o": "nothing", "u": false}, {"n": "_forget", "k": "function", "d": "Removes a finished request from the waiting list and marks its error as handled so asyncio does not print a warning.", "i": "conn: _Conn, rid: int, fut: asyncio.Future", "o": "nothing", "u": false}, {"n": "WsSource", "k": "class", "d": "Websocket client for xrpld: many requests at once, reconnect, server failover, network check.", "i": "-", "o": "-", "u": false}, {"n": "WsSource.__init__", "k": "method", "d": "Stores servers, timeouts, retry settings, network id to expect and an optional stop check.", "i": "servers: Sequence[str], *, e_ledger_bundle", "k": "method", "d": "Saves one ledger: transactions, then metas, then the ledger document last (all upserts).", "i": "ledger_doc: Dict[str, Any], tx_docs: List[Dict[str, Any]], meta_docs: List[Dict[str, Any]]", "o": "nothing", "u": false}, {"n": "MongoStore.highest_ledger", "k": "method", "d": "Highest stored ledger number (0 if none).", "i": "none", "o": "int", "u": false}, {"n": "MongoStore.get_checkpoint", "k": "method", "d": "Last ledger saved by tail (0 if none).", "i": "none", "o": "int", "u": false}, {"n": "MongoStore.set_checkpoint", "k": "method", "d": "Saves the tail checkpoint; never moves it back; rewrites an old text value as a number once.", "i": "index: int", "o": "nothing", "u": false}, {"n": "MongoStore._chunk_id", "k": "method", "d": "Id of a chunk mark, e.g. 'backfill_chunk:32570-32999'.", "i": "start: int, end: int", "o": "str", "u": false}, {"n": "MongoStore.mark_chunk_done", "k": "method", "d": "Marks a backfill chunk as finished with its ok/failed counts.", "i": "start: int, end: int, ok: int, failed: int", "o": "nothing", "u": false}, {"n": "MongoStore.done_chunks", "k": "method", "d": "The finished chunks inside a range.", "i": "start: int, end: int", "o": "set of (start, end)", "u": false}, {"n": "MongoStore.record_failure", "k": "method", "d": "Adds or updates a failed ledger with the reason and counts the retries.", "i": "block_number: int, reason: str", "o": "nothing", "u": false}, {"n": "MongoStore.clear_failure", "k": "method", "d": "Removes a ledger from the failed collection.", "i": "block_number: int", "o": "nothing", "u": false}, {"n": "MongoStore.list_failed", "k": "method", "d": "All failed ledger numbers, sorted.", "i": "none", "o": "list[int]", "u": false}, {"n": "MongoStore.list_failed_with_reasons", "k": "method", "d": "All failed ledgers with their failure reason.", "i": "none", "o": "list of (number, reason)", "u": false}, {"n": "MongoStore.count_failed", "k": "method", "d": "Number of failed ledgers.", "i _set_addresses", "k": "function", "d": "Yields the address fields (Account, Destination, Owner, Issuer, limit issuers) of one meta node.", "i": "fields: Dict[str, Any]", "o": "addresses (generator)", "u": false}, {"n": "extract_affected_accounts", "k": "function", "d": "Sorted list of every account touched by a transaction, taken from its meta.", "i": "meta: Any, *also: Any", "o": "list[str]", "u": false}, {"n": "delivered_amount", "k": "function", "d": "The amount really delivered, from meta (delivered_amount or DeliveredAmount).", "i": "meta: Any", "o": "amount or None", "u": false}, {"n": "drops_to_xrp", "k": "function", "d": "Exact XRP value (drops divided by 1,000,000) as Decimal128.", "i": "drops: Any", "o": "Decimal128 or None", "u": false}, {"n": "token_value", "k": "function", "d": "Token value text as exact Decimal128.", "i": "value: Any", "o": "Decimal128 or None", "u": false}, {"n": "readable_amount", "k": "function", "d": "Builds <prefix>_xrp / _currency / _issuer / _value fields for an amount.", "i": "prefix: str, amount: Any, tx_hash: Any = None", "o": "dict", "u": false}, {"n": "derived_tx_fields", "k": "function", "d": "Computes the added fields of a transaction: affected_accounts, delivered_amount and readable amounts.", "i": "doc: Dict[str, Any], meta: Any", "o": "dict", "u": false}, {"n": "_require", "k": "function", "d": "Gets a required ledger field or raises MalformedLedger.", "i": "ledger: Dict[str, Any], key: str, index: int", "o": "the value", "u": false}, {"n": "escape_key", "k": "function", "d": "Makes a field name safe for MongoDB ('.', NUL and a leading '$' replaced by look-alike characters).", "i": "key: Any", "o": "str", "u": false}, {"n": "unescape_key", "k": "function", "d": "Reverses escape_key.", "i": "key: str", "o": "str", "u": false}, {"n": "escape_keys", "k": "function", "d": "Copy of a value with every key made safe and huge integers stored as text.", "i": "value: Any", "o": "same type as input", "u": false}, {"n": "same_value", "k": "function", "d": "True if a received value adds nothing to the stored one.", "i": "stored: Any, received: Any", "o": "bool", "u": false}, {"n": "merge_field", "k": "function", "d": "Adds a received field to a document without losing anything (clash -> raw_<key>).", "i": "doc: Dict[str, Any], key: Any, value: Any, renames: Dict[str, str] = FIELD_RENAMES", "o": "nothing (changes the doc)", "u": false}, {"n": "put_derived", "k": "function", "d": "Sets a field we compute; a node field with the same name moves to raw_<key>.", "i": "doc: Dict[str, Any], key: str, value: Any", "o": "nothing (changes the doc)", "u": false}, {"n": "build_ledger_doc", "k": "function", "d": "Builds the ledger document: mapped header fields plus every other ledger field.", "i": "index: int, ledger: Dict[str, Any], num_transactions: int, now: datetime", "o": "dict", "u": false}, {"n": "coerce_fields", "k": "function", "d": "Converts number fields and drop amounts to int; counts the ones that could not be converted.", "i": "doc: Dict[str, Any], uncoerced: Dict[str, List[Any]]", "o": "nothing (changes the doc)", "u": false}, {"n": "warn_uncoerced", "k": "function", "d": "Logs one warning per field per ledger for values that could not be converted.", "i": "block_number: int, uncoerced: Dict[str, List[Any]]", "o": "nothing", "u": false}, {"n": "_meta_key", "k": "function", "d": "Finds which key holds the transaction meta: 'meta' (API v2) or 'metaData' (v1).", "i": "tx: Dict[str, Any]", "o": "str or None", "u": false}, {"n": "flatten_transactions", "k": "function", "d": "Builds a transaction document and a meta document for every transaction of a ledger.", "i": "block_number: int, block_hash: str, close_time: int, transactions: List[Any], now: datetime", "o": "(list of tx docs, list of meta docs)", "u": false}, {"n": "parse_ledger_result", "k": "function", "d": "Checks a ledger answer (validated, right number, has transactions list) and converts it into all documents.", "i": "index: int, res ject (_Recorder) to learn what it wants, then comparing with the real database. Network calls use 5-second timeouts (fast_store/fast_source from monitor.py).", "lines": 531, "folder": "xrpl_ingest/support", "functions": [{"n": "Check", "k": "class", "d": "One doctor result line: name, status, detail and exit code.", "i": "-", "o": "-", "u": false}, {"n": "Report", "k": "class", "d": "All check results.", "i": "-", "o": "-", "u": false}, {"n": "Report.add", "k": "method", "d": "Adds a result line (warn -> code 1, fail -> code 2 unless given).", "i": "name: str, status: str, detail: str, code: Optional[int] = None", "o": "Check", "u": false}, {"n": "Report.exit_code", "k": "method", "d": "The worst exit code of all lines.", "i": "none", "o": "int", "u": false}, {"n": "version_tuple", "k": "function", "d": "Version text to numbers, e.g. '4.10.1' -> (4, 10, 1).", "i": "v: str", "o": "tuple[int]", "u": false}, {"n": "satisfies", "k": "function", "d": "Checks a version against a simple rule like '>=4.9,<4.11'.", "i": "version: str, spec: str", "o": "bool", "u": false}, {"n": "check_versions", "k": "function", "d": "Checks the Python version and the installed pymongo, python-dotenv and websockets versions.", "i": "r: Report, version_of: Callable[[str], str] = metadata.version", "o": "nothing (adds to the report)", "u": false}, {"n": "config_rows", "k": "function", "d": "Every setting with its value (passwords hidden) and source.", "i": "cfg: Optional[Config], env: EnvFile, environ: Any, base_dir: str", "o": "list of (name, value, source)", "u": false}, {"n": "format_rows", "k": "function", "d": "Aligns the setting rows as text lines.", "i": "rows: List[Tuple[str, str, str]]", "o": "list[str]", "u": false}, {"n": "check_paths", "k": "function", "d": "Shows resolved paths, warns about hidden control characters, checks .env permissions and lock files.", "i": "r: Report, cfg: Config, env: EnvFile, command_locks = COMMAND_KEYS", "o": "nothing (adds to the report)", "u": false},  "Takes the one-instance lock for an ingest command."}, {"from_file": "xrpl_ingest/cli.py", "from": "_acquire_lock", "to_file": "xrpl_ingest/support/runcontrol.py", "to": "lock_path", "data": "base folder + command → <base>/xrpl_ingest.<command>.lock", "from_call": "_acquire_lock()", "to_call": "lock_path()", "how": "call", "does": "Path of the lock file for a command."}]}, "fetch": {"id": "fetch", "title": "Fetch one ledger from the node", "text": "For each ledger number, fetcher.ingest_ledger asks the node (through WsSource) for the full ledger with every transaction expanded. One websocket connection carries many requests at once; answers are matched by id. A dropped connection reconnects or fails over to the next server.", "files": ["xrpl_ingest/fetcher.py", "xrpl_ingest/source.py"], "steps": [{"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/source.py", "to": "WsSource.get_ledger", "data": "ledger number → raw ledger answer (dict, API v2, transactions expanded)", "from_call": "ingest_ledger()", "to_call": "WsSource.get_ledger()", "how": "via source.get_ledger", "does": "Asks for one ledger with all transactions expanded."}, {"from_file": "xrpl_ingest/source.py", "from": "WsSource.get_ledger", "to_file": "xrpl_ingest/source.py", "to": "WsSource.request", "data": "{command: ledger, ledger_index, transactions: true, expand: true} → JSON result", "from_call": "WsSource.get_ledger()", "to_call": "WsSource.request()", "how": "call", "does": "Sends a command on the current (or a new) connection."}, {"from_file": "xrpl_ingest/source.py", "from": "WsSource.request", "to_file": "xrpl_ingest/source.py", "to": "WsSource._get_conn", "data": "→ the open websocket (opens one if needed; only one reconnect at a time)", "from_call": "WsSource.request()", "to_call": "WsSource._get_conn()", "how": "call", "does": "Returns the open connection, or opens one (only one reconnect at a time)."}, {"from_file": "xrpl_ingest/source.py", "from": "WsSource._get_conn", "to_file": "xrpl_ingest/source.py", "to": "WsSource._open", "data": "tries each server in SERVERS; rejects a server whose network_id is not EXPECTED_NETWORK_ID", "from_call": "WsSource._get_conn()", "to_call": "WsSource._open()", "how": "call", "does": "Tries each server several times; checks the network; stops early if a stop was requested; raises NetworkMismatch if every server is on the wrong network, else …"}, {"from_file": "xrpl_ingest/source.py", "from": "WsSource.request", "to_file": "xrpl_ingest/source.py", "to": "WsSource._request_on", "data": "sends the request with an id, waits for the answer with that id (REQUEST_TIMEOUT)", "from_call": "WsSource.request()", "to_call": "WsSource._request_on()", "how": "call", "does": "Sends one request on a connection and waits for its answer with a timeout; turns error answers into RpcError."}]}, "convert": {"id": "convert", "title": "Convert to MongoDB documents", "text": "transform.py turns the raw answer into 3 kinds of documents without losing any field: one ledger document, one transaction document per transaction, one meta document per transaction. Clashing names go to raw_<key>; awkward key characters are escaped; extra fields (affected_accounts, delivered_amount, readable amounts) are added.", "files": ["xrpl_ingest/fetcher.py", "xrpl_ingest/transform.py"], "steps": [{"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/transform.py", "to": "parse_ledger_result", "data": "ledger number + raw answer → (ledger doc, list of tx docs, list of meta docs); not validated / malformed → error", "from_call": "ingest_ledger()", "to_call": "parse_ledger_result()", "how": "call", "does": "Checks a ledger answer (validated, right number, has transactions list) and converts it into all documents."}, {"from_file": "xrpl_ingest/transform.py", "from": "parse_ledger_result", "to_file": "xrpl_ingest/transform.py", "to": "build_ledger_doc", "data": "ledger header fields → ledger document (block_number, hashes, close time ...)", "from_call": "parse_ledger_result()", "to_call": "build_ledger_doc()", "how": "call", "does": "Builds the ledger document: mapped header fields plus every other ledger field."}, {"from_file": "xrpl_ingest/transform.py", "from": "parse_ledger_result", "to_file": "xrpl_ingest/transform.py", "to": "flatten_transactions", "data": "transactions list → tx documents + meta documents", "from_call": "parse_ledger_result()", "to_call": "flatten_transactions()", "how": "call", "does": "Builds a transaction document and a meta document for every transaction of a ledger."}, {"from_file": "xrpl_ingest/transform.py", "from": "flatten_transactions", "to_file": "xrpl_ingest/transform.py", "to": "derived_tx_fields", "data": "one transaction + its meta → affected_accounts, delivered_amount, *_xrp / *_value readable amounts", "from_call": "flatten_transactions()", "to_call": "derived_tx_fields()", "how": "call", "does": "Computes the added fields of a transaction: affected_accounts, delivered_amount and readable amounts."}]}, "save": {"id": "save", "title": "Save to MongoDB", "text": "store.save_ledger_bundle upserts transactions, then metas, then the ledger document LAST. If the ledger document exists, its transactions are complete. Upserts make re-running safe (no duplicates). The blocking pymongo call runs in a thread (asyncio.to_thread).", "files": ["xrpl_ingest/fetcher.py", "xrpl_ingest/store.py"], "steps": [{"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.save_ledger_bundle", "data": "(ledger doc, tx docs, meta docs) → written with upserts; ledger doc last = 'complete' marker", "from_call": "ingest_ledger()", "to_call": "MongoStore.save_ledger_bundle()", "how": "via store.save_ledger_bundle", "does": "Saves one ledger: transactions, then metas, then the ledger document last (all upserts)."}, {"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.clear_failure", "data": "re-ingest only: ledger number → removed from the failed collection", "from_call": "ingest_ledger()", "to_call": "MongoStore.clear_failure()", "how": "via store.clear_failure", "does": "Removes a ledger from the failed collection."}]}, "failure": {"id": "failure", "title": "Retry or record the failure", "text": "If fetch, convert or save fails, errors.is_retryable decides: temporary problems (timeouts, dropped connection, node busy, MongoDB hiccup) are retried after a growing wait with jitter; permanent ones are not. After the last try the ledger is written to the failed collection so retry-failed can do it later. Nothing is skipped silently.", "files": ["xrpl_ingest/fetcher.py", "xrpl_ingest/errors.py", "xrpl_ingest/store.py"], "steps": [{"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/errors.py", "to": "is_retryable", "data": "the exception → retry (True) or give up (False)", "from_call": "ingest_ledger()", "to_call": "is_retryable()", "how": "call", "does": "Decides if an error should be retried: StopRequested no; TransientError yes; RpcError if its code is temporary; any MongoDB error yes; everything else no."}, {"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/fetcher.py", "to": "RetryPolicy.delay", "data": "attempt number → seconds to wait (doubles, capped at BACKOFF_MAX, random jitter)", "from_call": "ingest_ledger()", "to_call": "RetryPolicy.delay()", "how": "via retry.delay(attempt)", "does": "Wait before retry number `attempt`: doubles each time, capped at max_delay, with random jitter."}, {"from_file": "xrpl_ingest/fetcher.py", "from": "ingest_ledger", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.record_failure", "data": "ledger number + reason text → failed collection (retry count kept)", "from_call": "ingest_ledger()", "to_call": "MongoStore.record_failure()", "how": "via store.record_failure", "does": "Adds or updates a failed ledger with the reason and counts the retries."}]}, "bf_range": {"id": "bf_range", "title": "backfill · choose the range", "text": "The range comes from --start/--end, else from backfill_range.txt, else 32570 .. latest. The range file is only read, never written.", "files": ["xrpl_ingest/cli.py", "xrpl_ingest/support/files.py"], "steps": [{"from_file": "xrpl_ingest/cli.py", "from": "_main", "to_file": "xrpl_ingest/cli.py", "to": "_cmd_backfill", "data": "Run (options, Config, stop check, store opener) → exit code", "from_call": "_main()", "to_call": "_cmd_backfill()", "how": "via COMMANDS[...].run(run)", "does": "backfill: picks the range (CLI options, range file or defaults) and runs run_backfill."}, {"from_file": "xrpl_ingest/cli.py", "from": "_cmd_backfill", "to_file": "xrpl_ingest/support/files.py", "to": "choose_range", "data": "--start / --end and the range-file path → BackfillRange(start, end, where it came from)", "from_call": "_cmd_backfill()", "to_call": "choose_range()", "how": "call", "does": "Picks the backfill range: command line first, else the range file, else defaults."}, {"from_file": "xrpl_ingest/support/files.py", "from": "choose_range", "to_file": "xrpl_ingest/support/files.py", "to": "load_range", "data": "range-file path → BackfillRange (defaults if the file is missing)", "from_call": "choose_range()", "to_call": "load_range()", "how": "call", "does": "Reads the range file; defaults when it does not exist (unless required)."}, {"from_file": "xrpl_ingest/support/files.py", "from": "load_range", "to_file": "xrpl_ingest/support/files.py", "to": "parse_range", "data": "file text → start / end; errors name the file and line", "from_call": "load_range()", "to_call": "parse_range()", "how": "call", "does": "Parses range-file text; errors name the file and line number."}]}, "bf_plan": {"id": "bf_plan", "title": "backfill · look at the node and plan chunks", "text": "Open MongoDB and the node, make sure indexes exist, ask the node which ledgers it has, skip chunks that are already finished, and split the rest into CHUNK_SIZE chunks.", "files": ["xrpl_ingest/cli.py", "xrpl_ingest/backfill.py", "xrpl_ingest/store.py", "xrpl_ingest/source.py", "xrpl_ingest/ledger_ranges.py"], "steps": [{"from_file": "xrpl_ingest/cli.py", "from": "_cmd_backfill", "to_file": "xrpl_ingest/backfill.py", "to": "run_backfill", "data": "Config, start, end, stop check → summary (chunks run, ledgers ok / failed, ranges the node lacks)", "from_call": "_cmd_backfill()", "to_call": "run_backfill()", "how": "call", "does": "The whole backfill of [start, end]: disk check, indexes, plan chunks, run them (process pool or inline for tests), return a summary."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.from_config", "data": "Config (MONGO_URI, DB_NAME, collection names) → MongoStore", "from_call": "run_backfill()", "to_call": "MongoStore.from_config()", "how": "call", "does": "Creates the MongoDB client with the configured timeouts and app name."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.ensure_indexes", "data": "creates the unique indexes (safe to repeat)", "from_call": "run_backfill()", "to_call": "MongoStore.ensure_indexes()", "how": "via store.ensure_indexes", "does": "Creates the indexes (unique block_number, unique tx hash, address and type indexes, affected_accounts, ...) if missing."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/source.py", "to": "WsSource.from_config", "data": "Config (SERVERS, timeouts, EXPECTED_NETWORK_ID) → WsSource", "from_call": "run_backfill()", "to_call": "WsSource.from_config()", "how": "call", "does": "Builds a WsSource from the Config settings."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/backfill.py", "to": "discover_node", "data": "WsSource → (ledger ranges the node has, newest validated ledger)", "from_call": "run_backfill()", "to_call": "discover_node()", "how": "call", "does": "Asks server_info for the ledgers the node has and its newest validated ledger."}, {"from_file": "xrpl_ingest/backfill.py", "from": "discover_node", "to_file": "xrpl_ingest/source.py", "to": "WsSource.server_info", "data": "→ server_info answer (complete_ledgers, validated_ledger)", "from_call": "discover_node()", "to_call": "WsSource.server_info()", "how": "via source.server_info", "does": "Asks the node for its status."}, {"from_file": "xrpl_ingest/backfill.py", "from": "discover_node", "to_file": "xrpl_ingest/ledger_ranges.py", "to": "parse_complete_ledgers", "data": "'32570-100,105' text → list of (start, end) ranges", "from_call": "discover_node()", "to_call": "parse_complete_ledgers()", "how": "call", "does": "Reads server_info's complete_ledgers text (e.g. '32570-100,105') into a list of ranges."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.done_chunks", "data": "start, end → set of chunks already finished (this is how a restart resumes)", "from_call": "run_backfill()", "to_call": "MongoStore.done_chunks()", "how": "via store.done_chunks", "does": "The finished chunks inside a range."}, {"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/ledger_ranges.py", "to": "plan_chunks", "data": "range + node ranges + CHUNK_SIZE + done chunks → (chunks to download, ranges the node does not have)", "from_call": "run_backfill()", "to_call": "plan_chunks()", "how": "call", "does": "Chunks still to download (node has them, not done yet) and ranges the node does not have."}]}, "bf_workers": {"id": "bf_workers", "title": "backfill · start worker processes", "text": "Chunks are handed to NUM_PROCESSES worker processes (spawn). Each worker opens its own MongoDB and websocket clients and downloads CONCURRENCY ledgers of its chunk at the same time.", "files": ["xrpl_ingest/backfill.py", "xrpl_ingest/store.py", "xrpl_ingest/source.py", "xrpl_ingest/fetcher.py"], "steps": [{"from_file": "xrpl_ingest/backfill.py", "from": "run_backfill", "to_file": "xrpl_ingest/backfill.py", "to": "_run_pool", "data": "Config + list of chunks → results per chunk; stops cleanly on stop file / signal / low disk", "from_call": "run_backfill()", "to_call": "_run_pool()", "how": "call", "does": "Runs chunks in a pool of worker processes, one chunk per process at a time; stops cleanly on stop file, signal or low disk; handles a dead worker and a second …"}, {"from_file": "xrpl_ingest/backfill.py", "from": "_run_pool", "to_file": "xrpl_ingest/backfill.py", "to": "_init_worker", "data": "once per worker: shared stop Event + log queue + log level", "from_call": "_run_pool()", "to_call": "_init_worker()", "how": "passed as a reference", "does": "Runs once in each worker process: ignore Ctrl+C, handle SIGTERM, send logs to the parent, keep the stop Event."}, {"from_file": "xrpl_ingest/backfill.py", "from": "_run_pool", "to_file": "xrpl_ingest/backfill.py", "to": "_run_chunk_in_process", "data": "(Config, chunk) sent to a worker process → ChunkResult", "from_call": "_run_pool()", "to_call": "_run_chunk_in_process()", "how": "passed as a reference", "does": "Entry point inside a worker process: opens MongoDB once per process, then runs process_chunk for one chunk."}, {"from_file": "xrpl_ingest/backfill.py", "from": "_run_chunk_in_process", "to_file": "xrpl_ingest/store.py", "to": "MongoStore.from_config", "data": "each worker opens its own MongoDB client", "from_call": "_run_chunk_in_process()", "to_call": "MongoStore.from_config()", "how": "call", "does": "Creates the MongoDB client with the configured timeouts and app name."}, {"from_file": "xrpl_ingest/backfill.py", "from": "_run_chunk_in_process", "to_file": "xrpl_ingest/source.py", "to": "WsSource.from_config", "data": "each worker opens its own websocket client", "from_ca     panel.classList.add("open"); panel.scrollTop = 0; return;
  }
  panelHeader(`${fileName(e.s)} → ${fileName(e.t)}`, `${e.s} → ${e.t}`);
  const how = e.kind === "object passed in"
    ? `${fileName(e.s)} does not import ${fileName(e.t)}; it is handed a ready object (a MongoStore or WsSource) and calls its methods.`
    : e.kind === "lazy import" ? `${fileName(e.s)} imports ${fileName(e.t)} inside a function (only when needed).`
    : `${fileName(e.s)} imports ${fileName(e.t)} at the top of the file.`;
  panel.append(el("div", { class: "job" }, `${fileName(e.s)} uses ${fileName(e.t)} to ${e.why}`), el("p", { class: "path" }, how));
  section("Files", [e.s, e.t], chip);
  if (e.stages.length) section("Used in these stages (click to show)", e.stages, stageChip);
  section("Names it uses from " + fileName(e.t), e.uses, (x) => el("span", { class: "chip plain" }, x));
  panel.append(el("h3", null, `Calls across this link (${e.calls.length}) — what goes in and what comes back`));
  if (!e.calls.length) panel.append(el("p", { class: "path" }, "No function calls cross this link: only classes, constants or types are imported (listed above)."));
  for (const c of e.calls) {
    const d = el("div", { class: "call" });
    d.append(el("code", null, `${c.caller}()  →  ${c.callee}()`));
    if (c.how && c.how !== "call") d.append(el("span", { class: "meta" }, "  " + c.how));
    if (c.does) d.append(el("div", null, c.does));
    d.append(kv([["sends", c.sends], ["gets back", c.gets_back]]));
    panel.append(d);
  }
  panel.classList.add("open"); panel.scrollTop = 0;
}

// ---------------- stages
const flowSel = $("flowSel"), card = $("stagecard");
for (const f of DATA.flows) flowSel.append(el("option", { value: f.id }, f.label));
function setFlow(id) {
  stopPlay();
  flow = DATA.flows.find((f) => f.id === id) || null;
  stageIdx = flow ? 0 : -1; allStages = false;
  for (const b of ["stPrev", "stNext", "stPlay", "stAll", "stArrange"]) $(b).disabled = !flow;
  if (!flow && arrange) { arrange = false; $("stArrange").classList.remove("on"); }
  arrangeByStage();
  updateStage(true);
}
function gotoStage(sid) {
  const f = flow && flow.stages.includes(sid) ? flow : DATA.flows.find((x) => x.stages.includes(sid));
  if (!f) return;
  if (f !== flow) { flowSel.value = f.id; setFlow(f.id); }
  stageIdx = flow.stages.indexOf(sid); allStages = false; updateStage(true);
}
function updateStage(refit) {
  selected = null; selectedEdge = null; focusPair = null; panel.classList.remove("open");
  $("stAll").classList.toggle("on", allStages);
  if (!flow) {
    $("stageTitle").textContent = "Pick a command to see, stage by stage, which files work together";
    card.style.display = "none"; render(); if (refit) fit((n) => n.group !== "legacy"); return;
  }
  $("stPrev").disabled = allStages || stageIdx <= 0; $("stNext").disabled = allStages || stageIdx >= flow.stages.length - 1;
  card.textContent = "";
  const x = el("button", { class: "x", title: "Hide this card" }, "×"); x.onclick = () => { card.style.display = "none"; };
  card.append(x);
  const ids = activeStageIds();
  $("stageTitle").textContent = allStages ? `${flow.label}: all ${flow.stages.length} stages` : `Stage ${stageIdx + 1} of ${flow.stages.length}: ${DATA.stages[ids[0]].title}`;
  for (const sid of ids) {
    const st = DATA.stages[sid], num = flow.stages.indexOf(sid) + 1;
    card.append(el("h4", null, `${num}. ${st.title}`));
    if (!allStages) card.append(el("p", null, st.text));
    const ol = el("ol");
    for (const s of st.steps) {
      const li = el("li");
      li.append(el("code", null, `${fileName(s.from_file)}:${s.from_call}`), document.createTextNode(" → "), el("code", null, `${fileName(s.to_file)}:${s.to_call}`));
      li.append(el("div", { class: "d" }, s.data));
      const key = s.from_file + "|" + s.to_file;
      li.onmouseenter = () => { focusPair = key; applyHighlight(); };
      li.onmouseleave = () => { focusPair = null; applyHighlight(); };
      ol.append(li);
    }
    card.append(ol);
  }
  card.style.display = "block";
  render();
  if (refit) { const sf = stageSets().files; if (arrange && allStages) fit(); else fit((n) => sf.has(n.id), 0.9); }
}
flowSel.onchange = () => setFlow(flowSel.value);
$("stPrev").onclick = () => { stopPlay(); if (stageIdx > 0) { stageIdx--; updateStage(true); } };
$("stNext").onclick = () => { stopPlay(); if (stageIdx < flow.stages.length - 1) { stageIdx++; updateStage(true); } };
$("stAll").onclick = () => { stopPlay(); allStages = !allStages; updateStage(true); };
$("stArrange").onclick = () => { arrange = !arrange; $("stArrange").classList.toggle("on", arrange); arrangeByStage(); updateStage(true); };
function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; } $("stPlay").textContent = "Play"; $("stPlay").classList.remove("on"); }
$("stPlay").onclick = () => {
  if (playTimer) { stopPlay(); return; }
  allStages = false; if (stageIdx >= flow.stages.length - 1) stageIdx = -1;
  const step = () => { if (stageIdx >= flow.stages.length - 1) { stopPlay(); return; } stageIdx++; updateStage(true); };
  step(); playTimer = setInterval(step, 4000);
  $("stPlay").textContent = "Pause"; $("stPlay").classList.add("on");
};

// ---------------- search
let currentMatches = new Set(); let resultList = []; let activeIdx = -1;
const search = $("search"), results = $("results");
function runSearch() {
  const q = search.value.trim().toLowerCase();
  results.textContent = ""; resultList = []; activeIdx = -1; currentMatches = new Set();
  if (!q) { results.style.display = "none"; applyHighlight(); return; }
  for (const n of DATA.nodes) {
    let why = "";
    if (n.id.toLowerCase().includes(q)) why = "file";
    else if (n.job.toLowerCase().includes(q)) why = "job";
    else { const fn = n.functions.find((f) => f.n.toLowerCase().includes(q)); if (fn) why = "function " + fn.n;
      else if ((n.purpose + " " + n.role + " " + n.res.join(" ")).toLowerCase().includes(q)) why = "text"; }
    if (why) { currentMatches.add(n.id); resultList.push({ n, why }); }
  }
  resultList.sort((a, b) => (a.why === "file" ? 0 : 1) - (b.why === "file" ? 0 : 1));
  for (const [i, r] of resultList.slice(0, 40).entries()) {
    const d = el("div", { "data-i": i }); d.append(document.createTextNode(r.n.short), el("small", null, `${r.n.job} · match: ${r.why}`));
    d.onclick = () => pick(r.n.id); results.append(d);
  }
  if (!resultList.length) results.append(el("div", null, "No match"));
  results.style.display = "block"; applyHighlight();
}
function pick(id) {
  results.style.display = "none";
  const n = byId.get(id);
  if (arrange && !inFlow(n)) { arrange = false; $("stArrange").classList.remove("on"); arrangeByStage(); }
  if (!visible(n)) { hidden.delete(n.group); if (n.group === "legacy") showLegacy = true; if (n.group.startsWith("test")) showTests = true; syncButtons(); buildLegend(); render(); }
  select(id, true);
}
search.addEventListener("input", runSearch);
search.addEventListener("keydown", (ev) => {
  const items = [...results.children];
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault(); if (!items.length) return;
    activeIdx = (activeIdx + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((x, i) => x.classList.toggle("active", i === activeIdx));
  } else if (ev.key === "Enter") { const r = resultList[Math.max(0, activeIdx)]; if (r) pick(r.n.id); }
  else if (ev.key === "Escape") { search.value = ""; runSearch(); }
});
document.addEventListener("click", (ev) => { if (!$("searchWrap").contains(ev.target)) results.style.display = "none"; });

// ---------------- buttons / keys
function syncButtons() { $("btnTests").textContent = "Tests: " + (showTests ? "on" : "off"); $("btnLegacy").textContent = "Legacy: " + (showLegacy ? "on" : "off"); }
$("btnTests").onclick = () => { showTests = !showTests; syncButtons(); render(); fit(); };
$("btnLegacy").onclick = () => { showLegacy = !showLegacy; syncButtons(); render(); fit(); };
$("btnLayout").onclick = () => { arrange = false; $("stArrange").classList.remove("on"); seedPositions(); arrangeByStage(); render(); fit((n) => n.group !== "legacy"); };
$("btnTheme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", (ev) => {
  if (document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (ev.key === "Escape") closePanel();
  if (flow && !allStages && ev.key === "ArrowRight") $("stNext").click();
  if (flow && !allStages && ev.key === "ArrowLeft") $("stPrev").click();
});

seedPositions(); buildLegend(); build(); fit((n) => n.group !== "legacy");  // start on the current code; ⤢ shows everything
</script>
</body>
</html>
